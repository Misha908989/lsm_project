{% extends 'base.html' %}

{% block title %}Email надіслано - LMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center">
                <i class="fas fa-envelope-open-text fa-5x text-success mb-4"></i>
                <h2>Email надіслано!</h2>
                <p class="lead">
                    Ми надіслали вам інструкції для відновлення пароля на електронну пошту.
                </p>
                <p class="text-muted">
                    Перевірте папку "Спам", якщо не бачите лист у вхідних.
                </p>
                <hr class="my-4">
                <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt"></i> Повернутися до входу
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
