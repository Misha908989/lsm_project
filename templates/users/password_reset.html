{% extends 'base.html' %}

{% block title %}Відновлення пароля - LMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">
                    <i class="fas fa-key text-primary"></i> Відновлення пароля
                </h2>
                <p class="text-muted text-center">
                    Введіть свій email, і ми надішлемо вам інструкції для відновлення пароля.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-paper-plane"></i> Надіслати
                        </button>
                    </div>
                </form>
                
                <hr class="my-4">
                <p class="text-center mb-0">
                    <a href="{% url 'users:login' %}">
                        <i class="fas fa-arrow-left"></i> Повернутися до входу
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
